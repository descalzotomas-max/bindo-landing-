<style>* { box-sizing: border-box; margin: 0; padding: 0 }
html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: #0E0E0E; color: #DEDEDE }
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px }
.card { width: 100%; max-width: 420px; background: #1A1A1A; border: 1px solid rgba(200,244,0,0.18); border-radius: 24px; overflow: hidden; box-shadow: 0 0 80px rgba(200,244,0,0.06), 0 32px 80px rgba(0,0,0,0.5) }
.card-top { background: linear-gradient(160deg, #1E1E1E 0%, #141414 100%); padding: 40px 36px 32px; display: flex; align-items: center; gap: 24px; border-bottom: 1px solid rgba(255,255,255,0.06); position: relative }
.card-top::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #C8F400, transparent) }
.photo { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(200,244,0,0.3); flex-shrink: 0 }
.name { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -0.5px; margin-bottom: 4px }
.role { font-size: 12px; font-weight: 700; color: #C8F400; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px }
.company { display: flex; align-items: center; gap: 8px; margin-top: 8px }
.tagline { padding: 20px 36px; font-size: 14px; color: #888; line-height: 1.65; font-weight: 300; border-bottom: 1px solid rgba(255,255,255,0.06) }
.actions { padding: 24px 36px; display: flex; flex-direction: column; gap: 12px }
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 20px; border-radius: 10px; font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; text-decoration: none; transition: transform 0.15s; letter-spacing: 0.3px }
.btn:active { transform: scale(0.97) }
.btn-wa { background: #C8F400; color: #0E0E0E; box-shadow: 0 0 24px rgba(200,244,0,0.25) }
.btn-li { background: rgba(255,255,255,0.05); color: #DEDEDE; border: 1px solid rgba(255,255,255,0.1) }
.btn-site { background: transparent; color: #777; font-size: 12px; font-weight: 500; font-family: 'DM Sans', sans-serif; padding: 8px; letter-spacing: 0 }
.divider { height: 1px; background: rgba(255,255,255,0.06); margin: 4px 0 }</style>
